<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Sign in</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-logo">Home<span>Vault</span></div><p class="muted">Your digital home records system.</p><form id="login" style="margin-top:25px"><div class="field"><label>Username</label><input name="username" value="admin" required></div><div class="field" style="margin-top:14px"><label>Password</label><input name="password" type="password" value="admin" required></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Sign in</button></form><p id="error" style="color:#b83b3b;margin-top:14px"></p><div class="notice" style="margin-top:20px"><strong>Demo admin</strong><br>Username: admin<br>Password: admin</div></div></div><script src="assets/app.js"></script><script>document.getElementById("login").onsubmit=e=>{e.preventDefault();const f=formData(e.target),u=state.users.find(x=>x.username===f.username&&x.password===f.password);if(!u){document.getElementById("error").textContent="Incorrect username or password.";return}sessionStorage.setItem(SESSION,JSON.stringify({username:u.username,role:u.role,name:u.name||u.username}));location.href="dashboard.html"}</script></body></html>
