<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Sign in</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-logo">Home<span>Vault</span></div><p class="muted">Your digital home records system.</p><form id="login" style="margin-top:25px"><div class="field"><label>Email address</label><input name="email" type="email" placeholder="you@example.com" required></div><div class="field" style="margin-top:14px"><label>Password</label><input name="password" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Sign in</button></form><p id="error" style="color:#b83b3b;margin-top:14px"></p><div class="notice" style="margin-top:20px">Use the email/password account you create in Firebase Authentication.</div></div></div><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
document.getElementById("login").onsubmit=async e=>{e.preventDefault();const f=formData(e.target);try{await hvReady;await hvAuth.signInWithEmailAndPassword(f.email,f.password);location.href="dashboard.html"}catch(err){document.getElementById("error").textContent=err.message||"Sign in failed."}};
</script></body></html>
