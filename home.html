<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — My Home</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
hvReady.then(()=>{try{
pageBase("home","My Home","Your property profile, ownership status and home details.");
window.renderHome = function renderHome(){const h=state.homes[0];document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>🏠 Home profile</h2><p>Tell HomeVault about the property.</p></div><button class="btn btn-primary" onclick="homeForm()">＋ ${h?"Edit":"Add"} home</button></div>${h?`<div class="grid g2"><div class="card hero"><div class="kpi-label">${h.tenure==="Rented"?"RENTED HOME":"OWNED HOME"}</div><h2 style="font-size:28px;margin-top:7px">${esc(h.name)}</h2><p>${esc(h.address)}</p><div class="actions"><span class="tag">${esc(h.type||"Property")}</span><span class="tag">${h.tenure==="Rented"?"Rented":"Owned"}</span></div></div><div class="card"><div class="record"><div class="record-icon">📅</div><div class="record-meta"><strong>${h.tenure==="Rented"?"Tenancy started":"Purchase date"}</strong><span>${date(h.tenure==="Rented"?h.tenancyStart:h.purchaseDate)}</span></div></div><div class="record"><div class="record-icon">🏗️</div><div class="record-meta"><strong>Year built</strong><span>${esc(h.yearBuilt||"Not recorded")}</span></div></div><div class="record"><div class="record-icon">📝</div><div class="record-meta"><strong>Notes</strong><span>${esc(h.notes||"No notes")}</span></div></div></div></div><div class="section grid g3"><div class="card"><h2>🔑 Tenure</h2><p>${h.tenure==="Rented"?"Renter tools are enabled for tenancy and deposit information.":"Owner tools are enabled for purchase and property information."}</p></div><div class="card"><h2>🛡️ Insurance</h2><p>${date(h.insuranceExpiry)}</p></div><div class="card"><h2>📄 Documents</h2><p>${state.documents.length} documents stored in HomeVault.</p></div></div>`:empty("🏠","No home added","Create your home profile to get started.",'<button class="btn btn-primary" onclick="homeForm()">Create home</button>')}`}
window.homeForm = function homeForm(){const h=state.homes[0]||{};modal("Home profile",`<form onsubmit="saveHome(event)"><div class="form-grid"><div class="field"><label>Property name</label><input name="name" value="${esc(h.name||"My Home")}" required></div><div class="field"><label>Owned or rented</label><select name="tenure"><option ${h.tenure!=="Rented"?"selected":""}>Owned</option><option ${h.tenure==="Rented"?"selected":""}>Rented</option></select></div><div class="field full"><label>Address</label><input name="address" value="${esc(h.address||"")}" required></div><div class="field"><label>Property type</label><input name="type" value="${esc(h.type||"Semi-detached")}" placeholder="Semi-detached"></div><div class="field"><label>Year built</label><input name="yearBuilt" type="number" value="${esc(h.yearBuilt||"")}"></div><div class="field"><label>Purchase date</label><input name="purchaseDate" type="date" value="${esc(h.purchaseDate||"")}"></div><div class="field"><label>Tenancy start (renters)</label><input name="tenancyStart" type="date" value="${esc(h.tenancyStart||"")}"></div><div class="field"><label>Insurance expiry</label><input name="insuranceExpiry" type="date" value="${esc(h.insuranceExpiry||"")}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(h.notes||"")}</textarea></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save home</button></div></form>`)}
window.saveHome = async function saveHome(e){
 e.preventDefault();
 if(!hvUser){toast("Please sign in again.");location.href="login.html";return}
 const previous=state.homes[0];
 const record={id:previous?.id||uid(),...formData(e.target)};
 state.homes=[record];
 try{
   await save();
   closeModal();
   renderHome();
   toast("Home saved to Firebase");
 }catch(err){
   if(previous) state.homes=[previous]; else state.homes=[];
   console.error("Home save failed:",err);
   toast("Home could not be saved. Check Firestore rules and try again.");
 }
}
renderHome();
}catch(e){console.error(e);showFirebaseError(e)}}).catch(showFirebaseError);
</script></body></html>
