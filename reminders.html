<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Reminders</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
hvReady.then(()=>{try{
pageBase("reminders","Reminders","Make sure important dates never get forgotten.");
window.renderReminders = function renderReminders(){const rs=state.reminders.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>🔔 Reminders</h2><p>Track servicing, renewals and important home dates.</p></div><button class="btn btn-primary" onclick="reminderForm()">＋ Add reminder</button></div><div class="card">${rs.length?rs.map(r=>`<div class="record"><div class="record-icon">🔔</div><div class="record-meta"><strong>${esc(r.title)}</strong><span>${date(r.date)} · ${esc(r.type||"Reminder")}</span></div><button class="btn btn-danger" onclick="deleteReminder('${r.id}')">Delete</button></div>`).join(""):empty("🔔","No reminders","Add a boiler service, MOT, insurance renewal or any other date.")}</div><div class="section card"><h2>Smart reminder preferences</h2><p style="margin-bottom:14px">Prototype settings ready for a production notification service.</p><div class="grid g4">${[30,14,7,1].map(d=>`<div class="card"><strong>${d} days before</strong><p>Reminder enabled</p></div>`).join("")}</div></div>`}
window.reminderForm = function reminderForm(){modal("Add reminder",`<form onsubmit="saveReminder(event)"><div class="form-grid"><div class="field"><label>Reminder</label><input name="title" placeholder="Boiler service" required></div><div class="field"><label>Type</label><select name="type"><option>Boiler</option><option>MOT</option><option>Insurance</option><option>Home</option><option>Personal</option><option>Other</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save reminder</button></div></form>`)}
window.saveReminder = function saveReminder(e){e.preventDefault();state.reminders.push({id:uid(),...formData(e.target)});addActivity("Added reminder");save();closeModal();renderReminders();toast("Reminder added")}
window.deleteReminder = function deleteReminder(id){state.reminders=state.reminders.filter(x=>x.id!==id);save();renderReminders();toast("Reminder deleted")}
renderReminders();
}catch(e){console.error(e);showFirebaseError(e)}}).catch(showFirebaseError);
</script></body></html>
