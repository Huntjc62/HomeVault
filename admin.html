<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Admin</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/app.js"></script><script>
if(!requireAuth()){} else {pageBase("admin","Admin","Prototype administration and local app data controls.");const s=session();if(s.role!=="Admin"){document.getElementById("content").innerHTML=empty("🔒","Admin only","This section is restricted.");}else{document.getElementById("content").innerHTML=`<div class="grid g4"><div class="card stat"><div><div class="stat-num">${state.users.length}</div><p>Users</p></div><div class="stat-icon">👥</div></div><div class="card stat"><div><div class="stat-num">${state.expenses.length}</div><p>Expenses</p></div><div class="stat-icon">💷</div></div><div class="card stat"><div><div class="stat-num">${state.documents.length}</div><p>Documents</p></div><div class="stat-icon">📄</div></div><div class="card stat"><div><div class="stat-num">${state.activity.length}</div><p>Activity events</p></div><div class="stat-icon">📊</div></div></div><div class="section card"><h2>Demo controls</h2><p>All data in this prototype is stored in this browser using localStorage.</p><div class="actions"><button class="btn btn-primary" onclick="exportData()">Export data</button><button class="btn btn-danger" onclick="resetAll()">Reset all demo data</button></div></div><div class="section card"><h2>Recent activity</h2>${state.activity.slice(0,20).map(a=>`<div class="record"><div class="record-icon">•</div><div class="record-meta"><strong>${esc(a.text)}</strong><span>${new Date(a.date).toLocaleString("en-GB")}</span></div></div>`).join("")||"<p>No activity yet.</p>"}</div>`}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="homevault-data.json";a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm("Delete all HomeVault demo data?")){localStorage.removeItem(KEY);location.href="dashboard.html"}}
</script></body></html>
