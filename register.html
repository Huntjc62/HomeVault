<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Register</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-logo">Home<span>Vault</span></div><p class="muted">Create a local prototype account.</p><form id="reg" style="margin-top:25px"><div class="field"><label>Name</label><input name="name"></div><div class="field" style="margin-top:14px"><label>Email address</label><input name="email" type="email" required></div><div class="field" style="margin-top:14px"><label>Password</label><input name="password" type="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Create account</button></form><p id="error" style="color:#b83b3b;margin-top:14px"></p><p style="margin-top:20px"><a href="login.html" style="color:#1c6b54;font-weight:800">Back to sign in</a></p></div></div><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
document.getElementById("reg").onsubmit=async e=>{e.preventDefault();const f=formData(e.target);try{await hvReady;const cred=await hvAuth.createUserWithEmailAndPassword(f.email,f.password);if(f.name)await cred.user.updateProfile({displayName:f.name});await hvDb.collection("users").doc(cred.user.uid).set({email:f.email,displayName:f.name||"",role:"user",createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});location.href="dashboard.html"}catch(err){document.getElementById("error").textContent=err.message||"Registration failed."}};
</script></body></html>
