<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Register</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-logo">Home<span>Vault</span></div><p class="muted">Create a local prototype account.</p><form id="reg" style="margin-top:25px"><div class="field"><label>Username</label><input name="username" required></div><div class="field" style="margin-top:14px"><label>Password</label><input name="password" type="password" required></div><div class="field" style="margin-top:14px"><label>Name</label><input name="name"></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Create account</button></form><p id="error" style="color:#b83b3b;margin-top:14px"></p><p style="margin-top:20px"><a href="login.html" style="color:#1c6b54;font-weight:800">Back to sign in</a></p></div></div><script src="assets/app.js"></script><script>document.getElementById("reg").onsubmit=e=>{e.preventDefault();const f=formData(e.target);if(state.users.some(u=>u.username===f.username)){document.getElementById("error").textContent="Username already exists.";return}state.users.push({username:f.username,password:f.password,name:f.name||f.username,role:"User"});save();location.href="login.html"}</script></body></html>
