<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeVault — Your home, organised.</title>
<style>
:root{
  --bg:#f5f7f6; --card:#fff; --text:#17211d; --muted:#6b7771;
  --primary:#1d6b52; --primary-dark:#14513e; --border:#e1e7e3;
  --danger:#c7463d; --warning:#c88420; --success:#2d8a62;
  --shadow:0 10px 30px rgba(23,33,29,.07); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;display:flex}
.sidebar{width:245px;background:#102b22;color:white;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:20}
.logo{font-size:24px;font-weight:800;padding:8px 12px 28px;letter-spacing:-.7px}
.logo span{color:#73c59e}
.nav button{width:100%;border:0;background:transparent;color:#c9d8d2;text-align:left;padding:13px 14px;border-radius:12px;margin:3px 0;font-weight:600}
.nav button:hover,.nav button.active{background:#1b4a3b;color:#fff}
.admin-link{margin-top:18px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}
.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.mobile-menu{display:none}
.user-pill{background:white;border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700}
h1{font-size:32px;letter-spacing:-1px;margin:0 0 7px}
h2{font-size:20px;margin:0 0 16px}
h3{font-size:16px;margin:0 0 7px}
p{margin:0;color:var(--muted);line-height:1.55}
.grid{display:grid;gap:18px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#1b5e48,#2b8a68);color:white;border:0}
.hero p{color:#d8eee4}
.hero-actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:white;color:var(--primary)}
.btn-ghost{background:#edf3f0;color:var(--text)}
.btn-danger{background:#fff0ee;color:var(--danger)}
.section{margin-top:24px}
.alert{display:flex;gap:14px;align-items:flex-start}
.alert-icon{font-size:25px}
.alert .days{font-weight:800;margin-top:5px}
.red{color:var(--danger)} .orange{color:var(--warning)} .green{color:var(--success)}
.stat{display:flex;justify-content:space-between;align-items:center}
.stat-number{font-size:30px;font-weight:800}
.stat-icon{font-size:27px}
.record{display:flex;align-items:center;gap:14px}
.record-icon{width:48px;height:48px;border-radius:14px;background:#edf5f1;display:grid;place-items:center;font-size:24px}
.record-meta{flex:1}
.record-meta strong{display:block}
.record-meta span{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf5f1;color:var(--primary);font-size:12px;font-weight:800}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--border);font-size:14px}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.empty{text-align:center;padding:40px 20px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:750}
input,select,textarea{border:1px solid var(--border);background:#fbfcfb;border-radius:10px;padding:11px 12px;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,107,82,.1)}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px}
.modal-wrap{position:fixed;inset:0;background:rgba(10,20,16,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-wrap.open{display:flex}
.modal{background:white;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:25px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close{border:0;background:#edf1ef;width:35px;height:35px;border-radius:50%;font-size:20px}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2d23,#276e54);padding:20px}
.login-card{background:white;width:min(430px,100%);padding:35px;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.2)}
.login-logo{font-size:30px;font-weight:850;margin-bottom:8px}
.login-logo span{color:var(--primary)}
.login-card .field{margin-top:15px}
.login-error{background:#fff0ee;color:var(--danger);padding:10px;border-radius:9px;margin-top:14px;font-size:13px}
.admin-stat{padding:18px;border-radius:15px;background:#f6f8f7}
.toast{position:fixed;right:20px;bottom:20px;background:#102b22;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:100}
.reminder-option{border:1px solid var(--border);border-radius:14px;padding:15px;background:#fbfcfb}
.reminder-option label{display:flex;align-items:center;gap:10px}
.reminder-option input[type="checkbox"]{width:18px;height:18px;accent-color:var(--primary)}
.scan-preview{border:2px dashed #cfdad5;border-radius:16px;padding:28px;text-align:center;background:#f8fbf9}
.extracted{background:#edf6f1;border-radius:14px;padding:16px}
.notice{padding:12px 14px;border-radius:11px;background:#fff7e8;color:#77501c;font-size:13px}

.toast.show{display:block}
@media(max-width:950px){
  .sidebar{width:205px}.main{margin-left:205px;width:calc(100% - 205px);padding:20px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .sidebar{transform:translateX(-100%);transition:.2s;width:270px}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:16px}.mobile-menu{display:block;border:0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px}
  .topbar{gap:10px}.topbar h1{font-size:25px}.grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}
  .page-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="login-logo">Home<span>Vault</span></div>
    <p>Your home, organised.</p>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="loginUsername" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="width:100%;margin-top:20px">Sign in</button>
      <div id="loginError" class="login-error hidden">Incorrect username or password.</div>
    </form>
    <p style="font-size:12px;margin-top:18px">MVP admin account: <strong>admin</strong> / <strong>admin</strong></p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="logo">Home<span>Vault</span></div>
    <nav class="nav">
      <button class="active" data-page="dashboard">🏠 Dashboard</button>
      <button data-page="home">🏡 My Home</button>
      <button data-page="boiler">🔥 Boiler</button>
      <button data-page="vehicle">🚗 Vehicle</button>
      <button data-page="appliances">🧊 Appliances</button>
      <button data-page="documents">📄 Documents</button>
      <button data-page="scanner">📸 Scan document</button>
      <button data-page="reminders">🔔 Reminders</button>
      <button data-page="expenses">💷 Expenses</button>
      <button data-page="timeline">📈 Timeline</button>
      <div class="admin-link">
        <button data-page="admin">⚙️ Admin</button>
      </div>
      <button id="logoutBtn">↪ Log out</button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu" id="mobileMenu">☰</button>
      <div>
        <h1 id="pageTitle">Good morning</h1>
        <p id="pageSubtitle">Everything important about your home, in one place.</p>
      </div>
      <div class="user-pill">👤 <span id="currentUser">admin</span></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="modalWrap" class="modal-wrap">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const STORAGE_KEY = "homevault_mvp_v1";
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {
  homes: [], boilers: [], vehicles: [], appliances: [], documents: [], reminders: [],
  users: [{username:"admin", role:"Admin"}],
  activity: [],
  reminderSettings: {days:[30,14,7,1], email:true, browser:true}
};
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
state.reminderSettings = state.reminderSettings || {days:[30,14,7,1], email:true, browser:true};
state.expenses = state.expenses || [];
state.timelineEvents = state.timelineEvents || [];
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function daysUntil(date){
  if(!date) return null;
  const d=new Date(date+"T00:00:00"), now=new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d-now)/86400000);
}
function formatDate(d){if(!d)return "—";return new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function statusDays(days){
  if(days===null)return '<span class="tag">Not set</span>';
  if(days<0)return `<span class="tag" style="color:#c7463d;background:#fff0ee">Overdue</span>`;
  if(days<=30)return `<span class="tag" style="color:#c7463d;background:#fff0ee">${days} days</span>`;
  if(days<=60)return `<span class="tag" style="color:#c88420;background:#fff5e5">${days} days</span>`;
  return `<span class="tag">${days} days</span>`;
}
function layoutPage(title,subtitle,body){document.getElementById("pageTitle").textContent=title;document.getElementById("pageSubtitle").textContent=subtitle;document.getElementById("content").innerHTML=body}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalWrap").classList.add("open")}
function closeModal(){document.getElementById("modalWrap").classList.remove("open")}
function addActivity(text){state.activity.unshift({id:uid(),text,date:new Date().toISOString()});state.activity=state.activity.slice(0,30);save()}

function dashboard(){
  const home=state.homes[0], boiler=state.boilers[0], vehicle=state.vehicles[0];
  const alerts=[];
  if(boiler?.nextService){const d=daysUntil(boiler.nextService);if(d<=60)alerts.push({icon:"🔥",title:"Boiler service",days:d,text:d<0?"Overdue":`Due in ${d} days`,cls:d<=30?"red":"orange"});}
  if(vehicle?.motExpiry){const d=daysUntil(vehicle.motExpiry);if(d<=60)alerts.push({icon:"🚗",title:"MOT",days:d,text:d<0?"Overdue":`Due in ${d} days`,cls:d<=30?"red":"orange"});}
  if(home?.insuranceExpiry){const d=daysUntil(home.insuranceExpiry);if(d<=60)alerts.push({icon:"🏠",title:"Home insurance",days:d,text:d<0?"Overdue":`Due in ${d} days`,cls:d<=30?"red":"orange"});}
  const alertHtml=alerts.length?alerts.map(a=>`<div class="card alert"><div class="alert-icon">${a.icon}</div><div><h3>${esc(a.title)}</h3><p class="${a.cls} days">${esc(a.text)}</p></div></div>`).join(""):`<div class="card"><div class="alert"><div class="alert-icon">✅</div><div><h3>You're all caught up</h3><p>No urgent home records need your attention.</p></div></div></div>`;
  layoutPage("Good morning","Everything important about your home, in one place.",`
    <div class="card hero">
      <h2>🏠 ${esc(home?.name || "Set up your home")}</h2>
      <p>${home?esc(home.address || "Add your property details to get started."):"Create your first home record and make HomeVault yours."}</p>
      <div class="hero-actions"><button class="btn btn-light" onclick="navigate('home')">${home?"View home":"Create my home"}</button><button class="btn btn-ghost" onclick="quickAdd()">＋ Add record</button></div>
    </div>
    <div class="section"><h2>⚠️ Needs attention</h2><div class="grid grid-3">${alertHtml}</div></div>
    <div class="section"><h2>My Home</h2>
      <div class="grid grid-4">
        <div class="card stat"><div><div class="stat-number">${boiler?"✓":"—"}</div><p>Boiler</p></div><div class="stat-icon">🔥</div></div>
        <div class="card stat"><div><div class="stat-number">${vehicle?"✓":"—"}</div><p>${vehicle?esc(vehicle.make+" "+vehicle.model):"Vehicle"}</p></div><div class="stat-icon">🚗</div></div>
        <div class="card stat"><div><div class="stat-number">${state.appliances.length}</div><p>Appliances</p></div><div class="stat-icon">🧊</div></div>
        <div class="card stat"><div><div class="stat-number">${state.documents.length}</div><p>Documents</p></div><div class="stat-icon">📄</div></div>
      </div>
    </div>
    <div class="section"><h2>💷 Home costs this year</h2><div class="grid grid-4">
      <div class="card hero"><p>Home costs this year</p><div style="font-size:28px;font-weight:850;margin-top:5px">£${expenseYearTotal().toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}</div><button class="btn btn-light" style="margin-top:14px" onclick="navigate('expenses')">View expenses</button></div>
      <div class="card stat"><div><div class="stat-number">£${expenseBreakdown().Home.toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0})}</div><p>🏠 Home</p></div></div>
      <div class="card stat"><div><div class="stat-number">£${expenseBreakdown().Vehicle.toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0})}</div><p>🚗 Car</p></div></div>
      <div class="card stat"><div><div class="stat-number">£${expenseBreakdown().Repairs.toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0})}</div><p>🔧 Repairs</p></div></div>
    </div></div>
    <div class="section"><h2>📈 Home Timeline</h2><div class="card"><div class="record"><div class="record-icon">📈</div><div class="record-meta"><strong>${buildTimelineEvents().length} events in your home history</strong><span>Services, purchases, repairs, renewals and improvements</span></div><button class="btn btn-ghost" onclick="navigate('timeline')">View timeline</button></div></div></div>
    <div class="section"><h2>Upcoming</h2><div class="card">${upcomingHtml()}</div></div>
  `);
}
function upcomingHtml(){
  const items=[];
  const b=state.boilers[0],v=state.vehicles[0],h=state.homes[0];
  if(b?.nextService)items.push(["🔥","Boiler service",b.nextService]);
  if(v?.motExpiry)items.push(["🚗","MOT",v.motExpiry]);
  if(v?.insuranceExpiry)items.push(["🛡️","Insurance",v.insuranceExpiry]);
  if(h?.insuranceExpiry && !v?.insuranceExpiry)items.push(["🏠","Home insurance",h.insuranceExpiry]);
  items.sort((a,b)=>a[2].localeCompare(b[2]));
  return items.length?items.slice(0,5).map(x=>`<div class="record" style="padding:12px 0"><div class="record-icon">${x[0]}</div><div class="record-meta"><strong>${esc(x[1])}</strong><span>${formatDate(x[2])}</span></div>${statusDays(daysUntil(x[2]))}</div>`).join(""):`<div class="empty"><h3>No upcoming reminders</h3><p>Add important dates to start building your home timeline.</p></div>`;
}

function homePage(){
 const h=state.homes[0];
 layoutPage("My Home","Your property's core information.",`
 <div class="page-head"><div><h2>🏠 Property profile</h2><p>Keep the important details about your home together.</p></div><button class="btn btn-primary" onclick="openHomeForm()">${h?"Edit home":"＋ Add home"}</button></div>
 ${h?`<div class="grid grid-2"><div class="card"><h2>${esc(h.name)}</h2><p>${esc(h.address)}</p><div class="grid grid-2" style="margin-top:20px"><div><p>Property type</p><strong>${esc(h.type||"—")}</strong></div><div><p>Purchase date</p><strong>${formatDate(h.purchaseDate)}</strong></div><div><p>Year built</p><strong>${esc(h.yearBuilt||"—")}</strong></div><div><p>Bedrooms</p><strong>${esc(h.bedrooms||"—")}</strong></div></div><div style="margin-top:20px"><p>${esc(h.notes||"No notes added.")}</p></div></div><div class="card"><h2>Property reminders</h2><div class="record"><div class="record-icon">🛡️</div><div class="record-meta"><strong>Home insurance</strong><span>${h.insuranceExpiry?formatDate(h.insuranceExpiry):"Not set"}</span></div>${statusDays(daysUntil(h.insuranceExpiry))}</div></div></div>`:`<div class="card empty"><div style="font-size:45px">🏠</div><h2>Create your home</h2><p>Start by adding your property details.</p></div>`}
 `);
}
function openHomeForm(){
 const h=state.homes[0]||{};
 openModal(h.name?"Edit home":"Create home",`<form onsubmit="saveHome(event)">
 <div class="form-grid">
 <div class="field"><label>Property name</label><input name="name" value="${esc(h.name)}" placeholder="My Home" required></div>
 <div class="field"><label>Property type</label><select name="type"><option ${h.type==="Semi-detached"?"selected":""}>Semi-detached</option><option ${h.type==="Detached"?"selected":""}>Detached</option><option ${h.type==="Terraced"?"selected":""}>Terraced</option><option>Flat</option><option>Bungalow</option><option>Other</option></select></div>
 <div class="field full"><label>Address</label><input name="address" value="${esc(h.address)}" placeholder="24 Example Road, Birmingham" required></div>
 <div class="field"><label>Purchase date</label><input type="date" name="purchaseDate" value="${esc(h.purchaseDate)}"></div>
 <div class="field"><label>Year built</label><input type="number" name="yearBuilt" value="${esc(h.yearBuilt)}"></div>
 <div class="field"><label>Bedrooms</label><input type="number" name="bedrooms" value="${esc(h.bedrooms)}"></div>
 <div class="field"><label>Home insurance expiry</label><input type="date" name="insuranceExpiry" value="${esc(h.insuranceExpiry)}"></div>
 <div class="field full"><label>Notes</label><textarea name="notes">${esc(h.notes)}</textarea></div>
 <div class="field full"><label>Property photo</label><input type="file" name="photo" accept="image/*"></div>
 </div><div class="actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save home</button></div></form>`);
}
function saveHome(e){e.preventDefault();const f=new FormData(e.target);const existing=state.homes[0]||{};const file=e.target.photo.files[0];const data={id:existing.id||uid(),name:f.get("name"),address:f.get("address"),type:f.get("type"),purchaseDate:f.get("purchaseDate"),yearBuilt:f.get("yearBuilt"),bedrooms:f.get("bedrooms"),insuranceExpiry:f.get("insuranceExpiry"),notes:f.get("notes"),photo:existing.photo||""};if(file){const r=new FileReader();r.onload=()=>{data.photo=r.result;state.homes=[data];save();addActivity("Updated home profile");closeModal();homePage();toast("Home saved");};r.readAsDataURL(file);}else{state.homes=[data];save();addActivity("Updated home profile");closeModal();homePage();toast("Home saved");}}

function boilerPage(){
 const b=state.boilers[0];
 layoutPage("Boiler","Store your boiler details, documents and service history.",`
 <div class="page-head"><div><h2>🔥 Boiler profile</h2><p>Everything you need to know about your boiler.</p></div><button class="btn btn-primary" onclick="openBoilerForm()">${b?"Edit boiler":"＋ Add boiler"}</button></div>
 ${b?`<div class="grid grid-2"><div class="card"><h2>${esc(b.manufacturer)} ${esc(b.model)}</h2><div class="grid grid-2"><div><p>Serial number</p><strong>${esc(b.serial||"—")}</strong></div><div><p>Installer</p><strong>${esc(b.installer||"—")}</strong></div><div><p>Installed</p><strong>${formatDate(b.installationDate)}</strong></div><div><p>Warranty expiry</p><strong>${formatDate(b.warrantyExpiry)}</strong></div><div><p>Last service</p><strong>${formatDate(b.lastService)}</strong></div><div><p>Next service</p><strong>${formatDate(b.nextService)}</strong></div></div><p style="margin-top:18px">${esc(b.notes||"No notes added.")}</p></div>
 <div class="card"><h2>📎 Documents</h2><p>Attach certificates, warranties and other boiler records.</p><button class="btn btn-ghost" style="margin-top:15px" onclick="navigate('documents')">View documents</button></div></div>
 <div class="section"><div class="page-head"><h2>Service history</h2><button class="btn btn-primary" onclick="openServiceForm()">＋ Add service</button></div><div class="card">${b.services?.length?`<table><thead><tr><th>Date</th><th>Provider</th><th>Cost</th></tr></thead><tbody>${b.services.map(s=>`<tr><td>${formatDate(s.date)}</td><td>${esc(s.provider)}</td><td>£${esc(s.cost||"0")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><h3>No service history yet</h3><p>Add your first boiler service.</p></div>`}</div></div>`:`<div class="card empty"><div style="font-size:45px">🔥</div><h2>No boiler added</h2><p>Add your boiler to start tracking servicing and warranty dates.</p></div>`}`);
}
function openBoilerForm(){
 const b=state.boilers[0]||{};
 openModal(b.manufacturer?"Edit boiler":"Add boiler",`<form onsubmit="saveBoiler(event)"><div class="form-grid">
 <div class="field"><label>Manufacturer</label><input name="manufacturer" value="${esc(b.manufacturer)}" placeholder="Vaillant" required></div>
 <div class="field"><label>Model</label><input name="model" value="${esc(b.model)}" placeholder="ecoTEC plus" required></div>
 <div class="field"><label>Serial number</label><input name="serial" value="${esc(b.serial)}"></div>

function expenseYearTotal(){
 const year=new Date().getFullYear();
 return state.expenses.reduce((sum,e)=>{
   const amount=Number(e.amount||0);
   if(e.frequency==="Monthly") return sum+amount*12;
   if(e.frequency==="Yearly") return sum+amount;
   if(e.date && new Date(e.date+"T00:00:00").getFullYear()===year) return sum+amount;
   return sum;
 },0);
}
function expenseScope(e){ return e.scope==="Personal" ? "Personal" : "Home"; }
function recurringMonthlyTotal(scope){
 return state.expenses.reduce((sum,e)=>{
   if(scope && expenseScope(e)!==scope)return sum;
   if(e.frequency==="Monthly") return sum+Number(e.amount||0);
   if(e.frequency==="Yearly") return sum+Number(e.amount||0)/12;
   return sum;
 },0);
}
function currentMonthActualTotal(scope){
 const now=new Date(),year=now.getFullYear(),month=now.getMonth();
 return state.expenses.filter(e=>expenseScope(e)===(scope||expenseScope(e)) && e.frequency==="One-off" && e.date).reduce((sum,e)=>{
   const d=new Date(e.date+"T00:00:00");
   return d.getFullYear()===year && d.getMonth()===month ? sum+Number(e.amount||0) : sum;
 },0);
}
function projectedMonthTotal(scope){
 return recurringMonthlyTotal(scope)+currentMonthActualTotal(scope);
}
function homeMonthlyCost(){
 return projectedMonthTotal("Home");
}
function personalMonthlyCost(){
 return projectedMonthTotal("Personal");
}
function combinedMonthlyCost(){
 return homeMonthlyCost()+personalMonthlyCost();
}
function expenseBreakdown(){
 const groups={Home:0,Vehicle:0,Repairs:0,Appliances:0,Boiler:0,Other:0};
 state.expenses.forEach(e=>{
   const amount=Number(e.amount||0);
   let annual=amount;
   if(e.frequency==="Monthly") annual=amount*12;
   if(e.frequency==="Yearly") annual=amount;
   const c=e.category||"Other";
   groups[c]=(groups[c]||0)+annual;
 });
 return groups;
}
function expenseCategoryLabel(c){
 return ({Home:"🏠 Home",Vehicle:"🚗 Car",Repairs:"🔧 Repairs",Appliances:"🧊 Appliances",Boiler:"🔥 Boiler",Other:"📦 Other"}[c]||c);
}
function expenseFrequencyLabel(f){
 return ({Monthly:"Monthly",Yearly:"Yearly", "One-off":"One-off"}[f]||f||"One-off");
}

function buildTimelineEvents(){
 const events=[];
 const h=state.homes[0],b=state.boilers[0],v=state.vehicles[0];
 if(h){
   if(h.purchaseDate)events.push({date:h.purchaseDate,icon:"🏠",title:"Home purchased",detail:h.name||"Property",category:"Home"});
   if(h.insuranceExpiry){
     const insuranceYear=new Date(h.insuranceExpiry+"T00:00:00").getFullYear();
     events.push({date:h.insuranceExpiry,icon:"🏠",title:"Home insurance renewed",detail:formatDate(h.insuranceExpiry),category:"Home"});
   }
   if(h.tenure==="Rented"){
     if(h.tenancyStart)events.push({date:h.tenancyStart,icon:"🔑",title:"Tenancy started",detail:h.name||"Rented home",category:"Home"});
     if(h.inventoryDate)events.push({date:h.inventoryDate,icon:"📋",title:"Inventory / check-in completed",detail:h.name||"Rented home",category:"Home"});
   }
 }
 if(b){
   if(b.installationDate)events.push({date:b.installationDate,icon:"🔥",title:"Boiler installed",detail:`${b.manufacturer||""} ${b.model||""}`.trim(),category:"Boiler"});
   if(b.lastService)events.push({date:b.lastService,icon:"🔥",title:"Boiler serviced",detail:b.manufacturer?`${b.manufacturer} ${b.model||""}`: "Boiler service",category:"Boiler"});
   (b.services||[]).forEach(s=>events.push({date:s.date,icon:"🔥",title:"Boiler serviced",detail:`${s.provider||"Service"}${s.cost?` · £${s.cost}`:""}`,category:"Boiler"}));
 }
 if(v){
   (v.history||[]).forEach(x=>events.push({date:x.date,icon:x.type==="MOT"?"🚗":x.type==="Repair"?"🔧":"🚗",title:`Vehicle ${x.type||"history"}`,detail:`${v.make||""} ${v.model||""}${x.details?` · ${x.details}`:""}${x.cost?` · £${x.cost}`:""}`.trim(),category:"Vehicle"}));
 }
 state.appliances.forEach(a=>{
   if(a.purchaseDate)events.push({date:a.purchaseDate,icon:a.icon||"🧊",title:`${a.name||"Appliance"} purchased`,detail:`${a.manufacturer||""} ${a.model||""}`.trim(),category:"Appliance"});
 });
 state.expenses.forEach(e=>{
   if(e.date)events.push({date:e.date,icon:e.category==="Vehicle"?"🚗":e.category==="Boiler"?"🔥":e.category==="Repairs"?"🔧":e.category==="Appliances"?"🧊":"💷",title:e.title||"Expense recorded",detail:`${e.category||"Other"}${e.amount?` · £${Number(e.amount).toLocaleString("en-GB",{minimumFractionDigits:2})}`:""}${e.frequency&&e.frequency!=="One-off"?` · ${e.frequency}`:""}${e.related?` · ${e.related}`:""}`,category:"Expense"});
 });
 state.documents.forEach(d=>{
   if(d.date)events.push({date:d.date,icon:"📄",title:"Document added",detail:d.name||d.category||"Document",category:"Document"});
 });
 state.reminders.forEach(r=>{
   if(r.date)events.push({date:r.date,icon:"🔔",title:"Reminder date",detail:r.title||"Reminder",category:"Reminder"});
 });
 // Deduplicate identical generated events where possible.
 (state.timelineEvents||[]).forEach(e=>events.push({date:e.date,icon:e.category==="Vehicle"?"🚗":e.category==="Boiler"?"🔥":e.category==="Appliance"?"🧊":e.category==="Repair"?"🔧":e.category==="Improvement"?"🪟":"🏠",title:e.title,detail:`${e.detail||""}${e.amount?` · £${Number(e.amount).toLocaleString("en-GB",{minimumFractionDigits:2})}`:""}${e.related?` · ${e.related}`:""}`.trim(),category:e.category}));
 const seen=new Set();
 return events.filter(e=>{
   const key=[e.date,e.title,e.detail].join("|");
   if(seen.has(key))return false;
   seen.add(key);return true;
 }).sort((a,b)=>b.date.localeCompare(a.date));
}

 <div class="section"><h2>Notification preview</h2>${preview||`<div class="card"><p>No reminder is currently at one of your selected intervals. HomeVault will surface it here when the date matches.</p></div>`}</div>
 <div class="section"><div class="card"><h2>How smart reminders work</h2><div class="grid grid-4" style="margin-top:15px">${(state.reminderSettings.days||[]).map(d=>`<div class="reminder-option"><strong>${d} day${d===1?"":"s"} before</strong><p style="margin-top:5px">Alert and email preparation point.</p></div>`).join("")}</div><div class="notice" style="margin-top:15px">Email delivery is represented in this V1 prototype. A production release will connect this to a secure email/notification service.</div></div></div>
 <div class="section"><div class="card">${items.length?`<table><thead><tr><th>Reminder</th><th>Date</th><th>Source</th><th>Status</th><th>Alert</th></tr></thead><tbody>${items.map(r=>`<tr><td>${r.icon||"🔔"} <strong>${esc(r.title)}</strong></td><td>${formatDate(r.date)}</td><td>${esc(r.source||"Manual")}</td><td>${statusDays(daysUntil(r.date))}</td><td>${getReminderMatches(r.date).length?`🔔 ${getReminderMatches(r.date)[0]} day alert`:"—"}</td></tr>`).join("")}</tbody></table>`:`<div class="empty"><h3>No reminders</h3><p>Add important dates and HomeVault will surface them here.</p></div>`}</div></div>`);
}

function openReminderForm(){openModal("Add reminder",`<form onsubmit="saveReminder(event)"><div class="form-grid"><div class="field"><label>Reminder</label><input name="title" placeholder="Home insurance renewal" required></div><div class="field"><label>Date</label><input type="date" name="date" required></div><div class="field"><label>Category</label><select name="source"><option>Home</option><option>Boiler</option><option>Vehicle</option><option>Appliance</option><option>Other</option></select></div></div><div class="actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save reminder</button></div></form>`)}
function saveReminder(e){e.preventDefault();const f=new FormData(e.target);state.reminders.push({id:uid(),title:f.get("title"),date:f.get("date"),source:f.get("source"),icon:"🔔"});save();addActivity("Added reminder");closeModal();remindersPage();toast("Reminder added")}

function adminPage(){
 layoutPage("Admin","MVP administration and site activity.",`
 <div class="grid grid-4">
  <div class="admin-stat"><p>Users</p><div class="stat-number">${state.users.length}</div></div>
  <div class="admin-stat"><p>Homes</p><div class="stat-number">${state.homes.length}</div></div>
  <div class="admin-stat"><p>Records</p><div class="stat-number">${state.boilers.length+state.vehicles.length+state.appliances.length}</div></div>
  <div class="admin-stat"><p>Documents</p><div class="stat-number">${state.documents.length}</div></div>
 </div>
 <div class="section grid grid-2">
  <div class="card"><h2>🔐 Admin account</h2><p><strong>Username:</strong> admin</p><p style="margin-top:5px"><strong>Role:</strong> Administrator</p><p style="margin-top:15px;font-size:13px">This V1 demo uses local browser storage. Real production authentication must be moved to a secure server/database.</p></div>
  <div class="card"><h2>📈 Site activity</h2>${state.activity.length?state.activity.slice(0,8).map(a=>`<div class="record" style="padding:8px 0"><div class="record-icon">•</div><div class="record-meta"><strong>${esc(a.text)}</strong><span>${new Date(a.date).toLocaleString("en-GB")}</span></div></div>`).join(""):`<p>No activity yet.</p>`}</div>
 </div>
 <div class="section card"><h2>V1 data</h2><p>All demo data is currently stored in this browser using localStorage. This makes the prototype easy to test, but it is not suitable for multi-user production use.</p><button class="btn btn-danger" style="margin-top:15px" onclick="resetDemo()">Reset demo data</button></div>
 `);
}
function resetDemo(){if(confirm("Reset all HomeVault demo data?")){localStorage.removeItem(STORAGE_KEY);location.reload()}}

function quickAdd(){openModal("Add record",`<div class="grid grid-2"><button class="btn btn-ghost" onclick="closeModal();navigate('home')">🏠 Home</button><button class="btn btn-ghost" onclick="closeModal();navigate('boiler')">🔥 Boiler</button><button class="btn btn-ghost" onclick="closeModal();navigate('vehicle')">🚗 Vehicle</button><button class="btn btn-ghost" onclick="closeModal();navigate('appliances')">🧊 Appliance</button><button class="btn btn-ghost" onclick="closeModal();navigate('documents')">📄 Document</button><button class="btn btn-ghost" onclick="closeModal();navigate('reminders')">🔔 Reminder</button><button class="btn btn-ghost" onclick="closeModal();navigate('expenses')">💷 Expense</button><button class="btn btn-ghost" onclick="closeModal();navigate('timeline')">📈 Timeline event</button></div>`)}
function navigate(page){
 document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 document.getElementById("sidebar").classList.remove("open");
 ({dashboard,home:homePage,boiler:boilerPage,vehicle:vehiclePage,appliances:appliancesPage,documents:documentsPage,scanner:scannerPage,reminders:remindersPage,expenses:expensesPage,timeline:timelinePage,admin:adminPage}[page]||dashboard)();
}
document.querySelectorAll(".nav button[data-page]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("logoutBtn").addEventListener("click",()=>{sessionStorage.removeItem("homevault_auth");document.getElementById("app").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");});
document.getElementById("loginForm").addEventListener("submit",e=>{
 e.preventDefault();const u=document.getElementById("loginUsername").value,p=document.getElementById("loginPassword").value;
 if(u==="admin"&&p==="admin"){sessionStorage.setItem("homevault_auth","1");document.getElementById("loginError").classList.add("hidden");showApp()}else document.getElementById("loginError").classList.remove("hidden");
});
function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("currentUser").textContent="admin";navigate("dashboard")}
if(sessionStorage.getItem("homevault_auth")==="1")showApp();
</script>
</body>
</html>
