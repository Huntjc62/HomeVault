<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Documents</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
hvReady.then(()=>{try{
pageBase("documents","Documents","Keep your important home documents organised.");
function renderDocs(){document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>📄 Documents</h2><p>Receipts, warranties, certificates, insurance and property documents.</p></div><button class="btn btn-primary" onclick="docForm()">＋ Upload document</button></div><div class="grid g3">${state.documents.map(d=>`<div class="card"><div class="record"><div class="record-icon">📄</div><div class="record-meta"><strong>${esc(d.name)}</strong><span>${esc(d.category)} · ${date(d.date)}</span></div></div><div class="section"><p>${esc(d.fileName||"No file attached")}</p>${d.expiry?`<p>Expires ${date(d.expiry)}</p>`:""}</div><div class="actions"><button class="btn btn-ghost" onclick="openDoc('${d.id}')">View</button><button class="btn btn-danger" onclick="deleteDoc('${d.id}')">Delete</button></div></div>`).join("")||`<div class="card">${empty("📄","No documents","Upload a warranty, receipt, certificate or home document.",'<button class="btn btn-primary" onclick="docForm()">Upload document</button>')}</div>`}</div>`}
function docForm(){modal("Add document",`<form onsubmit="saveDoc(event)"><div class="form-grid"><div class="field"><label>Document name</label><input name="name" placeholder="Boiler warranty" required></div><div class="field"><label>Category</label><select name="category"><option>Warranty</option><option>Receipt</option><option>Insurance</option><option>Certificate</option><option>Mortgage</option><option>Manual</option><option>Property</option><option>Other</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Expiry</label><input name="expiry" type="date"></div><div class="field full"><label>File</label><input name="file" type="file" accept=".pdf,image/*"></div></div><div class="notice" style="margin-top:15px">Documents are stored securely: metadata is saved in Firestore and the uploaded PDF/image is stored in your private Firebase Storage area.</div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save document</button></div></form>`)}
async function saveDoc(e){e.preventDefault();const f=e.target,fd=new FormData(f),file=f.file.files[0],id=uid();let storagePath="";if(file){try{const ref=hvStorage.ref(`users/${hvUser.uid}/documents/${id}/${file.name}`);await ref.put(file);storagePath=ref.fullPath}catch(err){console.error(err);toast("File upload failed");return}}state.documents.unshift({id,name:fd.get("name"),category:fd.get("category"),date:fd.get("date"),expiry:fd.get("expiry"),fileName:file?.name||"",storagePath});addActivity("Added document");await save();closeModal();renderDocs();toast("Document saved to Firebase")}
async function openDoc(id){const d=state.documents.find(x=>x.id===id);if(!d)return;let link="";if(d.storagePath){try{link=await hvStorage.ref(d.storagePath).getDownloadURL()}catch(e){}}modal(d.name,`<div class="card"><h3>${esc(d.name)}</h3><p>Category: ${esc(d.category)}</p><p style="margin-top:8px">File: ${esc(d.fileName||"No file attached")}</p>${link?`<div class="actions"><a class="btn btn-primary" target="_blank" rel="noopener" href="${esc(link)}">Open document</a></div>`:`<p style="margin-top:8px" class="muted">No downloadable file is attached.</p>`}</div>`)}
async function deleteDoc(id){const d=state.documents.find(x=>x.id===id);if(!d||!confirm("Delete this document record?"))return;if(d.storagePath){try{await hvStorage.ref(d.storagePath).delete()}catch(e){console.warn("Storage delete failed",e)}}state.documents=state.documents.filter(x=>x.id!==id);await save();renderDocs();toast("Document deleted")}
renderDocs();
}catch(e){console.error(e);showFirebaseError(e)}}).catch(showFirebaseError);
</script></body></html>
