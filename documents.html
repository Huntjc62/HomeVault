<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Documents</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/app.js"></script><script>
pageBase("documents","Documents","Keep your important home documents organised.");
function renderDocs(){document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>📄 Documents</h2><p>Receipts, warranties, certificates, insurance and property documents.</p></div><button class="btn btn-primary" onclick="docForm()">＋ Upload document</button></div><div class="grid g3">${state.documents.map(d=>`<div class="card"><div class="record"><div class="record-icon">📄</div><div class="record-meta"><strong>${esc(d.name)}</strong><span>${esc(d.category)} · ${date(d.date)}</span></div></div><div class="section"><p>${esc(d.fileName||"No file attached")}</p>${d.expiry?`<p>Expires ${date(d.expiry)}</p>`:""}</div><div class="actions"><button class="btn btn-ghost" onclick="openDoc('${d.id}')">View</button><button class="btn btn-danger" onclick="deleteDoc('${d.id}')">Delete</button></div></div>`).join("")||`<div class="card">${empty("📄","No documents","Upload a warranty, receipt, certificate or home document.",'<button class="btn btn-primary" onclick="docForm()">Upload document</button>')}</div>`}</div>`}
function docForm(){modal("Add document",`<form onsubmit="saveDoc(event)"><div class="form-grid"><div class="field"><label>Document name</label><input name="name" placeholder="Boiler warranty" required></div><div class="field"><label>Category</label><select name="category"><option>Warranty</option><option>Receipt</option><option>Insurance</option><option>Certificate</option><option>Mortgage</option><option>Manual</option><option>Property</option><option>Other</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Expiry</label><input name="expiry" type="date"></div><div class="field full"><label>File</label><input name="file" type="file" accept=".pdf,image/*"></div></div><div class="notice" style="margin-top:15px">In this MVP the document record is saved locally in this browser. Production HomeVault should move files to private cloud storage.</div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save document</button></div></form>`)}
function saveDoc(e){e.preventDefault();const f=e.target,fd=new FormData(f),file=f.file.files[0];state.documents.unshift({id:uid(),name:fd.get("name"),category:fd.get("category"),date:fd.get("date"),expiry:fd.get("expiry"),fileName:file?.name||""});addActivity("Added document");save();closeModal();renderDocs();toast("Document saved")}
function openDoc(id){const d=state.documents.find(x=>x.id===id);if(d)modal(d.name,`<div class="card"><h3>${esc(d.name)}</h3><p>Category: ${esc(d.category)}</p><p style="margin-top:8px">File: ${esc(d.fileName||"No file attached")}</p><p style="margin-top:8px">This prototype stores the document record locally. The production storage layer will securely store the original file.</p></div>`)}
function deleteDoc(id){if(!confirm("Delete this document record?"))return;state.documents=state.documents.filter(x=>x.id!==id);save();renderDocs();toast("Document deleted")}
renderDocs();
</script></body></html>
