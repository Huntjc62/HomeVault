<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Scan document</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/app.js"></script><script>
pageBase("scanner","Scan document","Prototype the future AI document extraction workflow.");
document.getElementById("content").innerHTML=`<div class="grid g2"><div class="card hero"><h2 style="font-size:27px">📸 Scan a document</h2><p>Upload a photo or PDF and HomeVault can eventually extract the useful information automatically.</p><div class="actions"><label class="btn btn-light">Choose document <input id="scanFile" type="file" accept=".pdf,image/*" hidden></label></div></div><div class="card"><h2>What HomeVault will extract</h2>${["Manufacturer","Model","Serial number","Warranty period","Expiry date","Document type"].map(x=>`<div class="record"><div class="record-icon">✓</div><div class="record-meta"><strong>${x}</strong><span>AI/OCR extraction in production</span></div></div>`).join("")}</div></div><div class="section card" id="scanResult">${empty("📄","Ready to scan","Choose a document to see the prototype review step.")}</div>`;
document.getElementById("scanFile").onchange=e=>{const f=e.target.files[0];if(!f)return;document.getElementById("scanResult").innerHTML=`<h2>Review extracted information</h2><p style="margin-bottom:18px">Prototype extraction for <strong>${esc(f.name)}</strong>. Edit anything before saving.</p><form onsubmit="saveScan(event,'${esc(f.name)}')"><div class="form-grid"><div class="field"><label>Manufacturer</label><input name="manufacturer" value="Worcester Bosch"></div><div class="field"><label>Model</label><input name="model" value="Greenstar 30i"></div><div class="field"><label>Warranty</label><input name="warranty" value="10 years"></div><div class="field"><label>Expiry</label><input name="expiry" type="date" value="2032-06-12"></div><div class="field"><label>Document type</label><select name="category"><option>Warranty</option><option>Certificate</option><option>Receipt</option><option>Other</option></select></div><div class="field"><label>Serial number</label><input name="serial"></div></div><div class="actions"><button class="btn btn-primary">Save to HomeVault</button></div></form>`};
function saveScan(e,fileName){e.preventDefault();const f=formData(e.target);state.documents.unshift({id:uid(),name:`${f.manufacturer} ${f.model} ${f.category}`,category:f.category,date:today(),expiry:f.expiry,fileName});addActivity("Saved scanned document");save();document.getElementById("scanResult").innerHTML=empty("✓","Saved to HomeVault","The extracted document information is now in Documents.",'<a class="btn btn-primary" href="documents.html">Open documents</a>');toast("Document saved")}
</script></body></html>
