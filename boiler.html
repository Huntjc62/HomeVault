<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Boiler</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
hvReady.then(()=>{try{
pageBase("boiler","Boiler","Store boiler details, servicing and warranty information.");
window.renderBoiler = function renderBoiler(){const b=state.boilers[0];document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>🔥 Boiler profile</h2><p>Keep your boiler information and service history together.</p></div><button class="btn btn-primary" onclick="boilerForm()">＋ ${b?"Edit":"Add"} boiler</button></div>${b?`<div class="grid g2"><div class="card hero"><div class="kpi-label">BOILER</div><h2 style="font-size:28px;margin-top:7px">${esc(b.manufacturer)} ${esc(b.model)}</h2><p>Serial ${esc(b.serial||"Not recorded")}</p><div class="actions"><span class="tag">Warranty ${date(b.warrantyExpiry)}</span><span class="tag">Next service ${date(b.nextService)}</span></div></div><div class="card"><div class="record"><div class="record-icon">📅</div><div class="record-meta"><strong>Installation</strong><span>${date(b.installationDate)}</span></div></div><div class="record"><div class="record-icon">🛠️</div><div class="record-meta"><strong>Installer</strong><span>${esc(b.installer||"Not recorded")}</span></div></div><div class="record"><div class="record-icon">💷</div><div class="record-meta"><strong>Installation cost</strong><span>${money(b.installationCost)}</span></div></div></div></div><div class="section card"><div class="section-head"><h2>Service history</h2><button class="btn btn-ghost" onclick="serviceForm()">＋ Add service</button></div>${(b.services||[]).length?(b.services||[]).sort((a,c)=>c.date.localeCompare(a.date)).map(s=>`<div class="record"><div class="record-icon">🔥</div><div class="record-meta"><strong>Boiler service</strong><span>${date(s.date)} · ${esc(s.provider||"Provider")}</span></div><strong>${money(s.cost)}</strong></div>`).join(""):empty("🛠️","No service history","Add your first boiler service.")}</div>`:empty("🔥","No boiler added","Add your boiler profile.",'<button class="btn btn-primary" onclick="boilerForm()">Add boiler</button>')}`}
window.boilerForm = function boilerForm(){const b=state.boilers[0]||{};modal("Boiler profile",`<form onsubmit="saveBoiler(event)"><div class="form-grid">${[['manufacturer','Manufacturer'],['model','Model'],['serial','Serial number'],['installer','Installer']].map(x=>`<div class="field"><label>${x[1]}</label><input name="${x[0]}" value="${esc(b[x[0]]||"")}"></div>`).join("")}<div class="field"><label>Installation date</label><input name="installationDate" type="date" value="${esc(b.installationDate||"")}"></div><div class="field"><label>Installation cost</label><input name="installationCost" type="number" step=".01" value="${esc(b.installationCost||"")}"></div><div class="field"><label>Warranty expiry</label><input name="warrantyExpiry" type="date" value="${esc(b.warrantyExpiry||"")}"></div><div class="field"><label>Last service</label><input name="lastService" type="date" value="${esc(b.lastService||"")}"></div><div class="field"><label>Next service</label><input name="nextService" type="date" value="${esc(b.nextService||"")}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(b.notes||"")}</textarea></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save boiler</button></div></form>`)}
window.saveBoiler = function saveBoiler(e){e.preventDefault();const f=formData(e.target);state.boilers=[{id:state.boilers[0]?.id||uid(),...f,installationCost:+f.installationCost||0,services:state.boilers[0]?.services||[]}];addActivity("Updated boiler");save();closeModal();renderBoiler();toast("Boiler saved")}
window.serviceForm = function serviceForm(){modal("Add boiler service",`<form onsubmit="saveService(event)"><div class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Provider</label><input name="provider" placeholder="British Gas" required></div><div class="field"><label>Cost</label><input name="cost" type="number" step=".01" required></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Add service</button></div></form>`)}
window.saveService = function saveService(e){e.preventDefault();const f=formData(e.target);const b=state.boilers[0];b.services=b.services||[];b.services.push({id:uid(),...f,cost:+f.cost||0});b.lastService=f.date;addActivity("Added boiler service");save();closeModal();renderBoiler();toast("Service added")}
renderBoiler();
}catch(e){console.error(e);showFirebaseError(e)}}).catch(showFirebaseError);
</script></body></html>
