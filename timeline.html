<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Timeline</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script><script>
hvReady.then(()=>{try{
pageBase("timeline","Home Timeline","Build a digital history of your property.");
function renderTimeline(){const ev=state.timelineEvents.slice().sort((a,b)=>b.date.localeCompare(a.date));const groups={};ev.forEach(e=>(groups[new Date(e.date+"T00:00:00").getFullYear()]??=[]).push(e));document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>📈 Home Timeline</h2><p>${ev.length} recorded property events.</p></div><button class="btn btn-primary" onclick="timelineForm()">＋ Add event</button></div>${Object.keys(groups).sort((a,b)=>b-a).map(y=>`<h2 class="year-title">${y}</h2><div class="card timeline">${groups[y].map(e=>`<div class="timeline-item"><div class="timeline-dot">${e.icon||"🏠"}</div><div class="record-meta"><strong>${esc(e.title)}</strong><span>${date(e.date)} · ${esc(e.detail||"")}</span></div><button class="btn btn-danger" onclick="deleteTimeline('${e.id}')">Delete</button></div>`).join("")}</div>`).join("")||`<div class="card">${empty("📈","No timeline events","Add a service, purchase, repair or improvement.")}</div>`}`}
function timelineForm(){modal("Add timeline event",`<form onsubmit="saveTimeline(event)"><div class="form-grid"><div class="field"><label>Event</label><input name="title" placeholder="Windows installed" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Icon</label><select name="icon"><option>🏠</option><option>🔥</option><option>🚗</option><option>🧊</option><option>🔧</option><option>🪟</option><option>📄</option></select></div><div class="field"><label>Detail</label><input name="detail"></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Add event</button></div></form>`)}
function saveTimeline(e){e.preventDefault();state.timelineEvents.push({id:uid(),...formData(e.target)});addActivity("Added timeline event");save();closeModal();renderTimeline();toast("Timeline event added")}
function deleteTimeline(id){state.timelineEvents=state.timelineEvents.filter(x=>x.id!==id);save();renderTimeline();toast("Timeline event deleted")}
renderTimeline();
}catch(e){console.error(e);showFirebaseError(e)}}).catch(showFirebaseError);
</script></body></html>
