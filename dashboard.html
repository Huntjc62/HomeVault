<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Dashboard</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/app.js"></script><script>
pageBase("dashboard","Dashboard","Everything you need to remember about your home, in one place.");
const home=state.homes[0],homeCost=monthlyCost("Home"),personalCost=monthlyCost("Personal"),combined=homeCost+personalCost;
const attention=state.reminders.filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
document.getElementById("content").innerHTML=`<div class="grid g2"><div class="card hero"><div class="kpi-label">GOOD MORNING</div><div style="font-size:29px;font-weight:900;margin-top:6px">${esc(session()?.name||"")}</div><p style="margin-top:7px">HomeVault keeps the important things about your home organised.</p><div class="actions"><a class="btn btn-light" href="home.html">View my home</a><button class="btn btn-light" onclick="expenseForm()">＋ Add expense</button></div></div><div class="card"><div class="section-head"><h2>💷 Monthly picture</h2><span class="tag">Next month</span></div><div class="record"><div class="record-icon">🏠</div><div class="record-meta"><strong>Home</strong><span>Home costs</span></div><strong>${money(homeCost)}</strong></div><div class="record"><div class="record-icon">👤</div><div class="record-meta"><strong>Personal</strong><span>Personal costs</span></div><strong>${money(personalCost)}</strong></div><div class="record"><div class="record-icon">💷</div><div class="record-meta"><strong>Combined</strong><span>Overall monthly cost</span></div><strong>${money(combined)}</strong></div><a class="btn btn-ghost" style="display:inline-block;margin-top:14px" href="expenses.html">Open expenses</a></div></div>
<div class="section grid g4"><div class="card stat"><div><div class="stat-num">${state.boilers.length}</div><p>Boilers</p></div><div class="stat-icon">🔥</div></div><div class="card stat"><div><div class="stat-num">${state.vehicles.length}</div><p>Vehicles</p></div><div class="stat-icon">🚗</div></div><div class="card stat"><div><div class="stat-num">${state.appliances.length}</div><p>Appliances</p></div><div class="stat-icon">🧊</div></div><div class="card stat"><div><div class="stat-num">${state.documents.length}</div><p>Documents</p></div><div class="stat-icon">📄</div></div></div>
<div class="section grid g2"><div class="card"><div class="section-head"><h2>⚠️ Needs attention</h2><a href="reminders.html" class="muted">View all</a></div>${attention.length?attention.map(r=>`<div class="record"><div class="record-icon">🔔</div><div class="record-meta"><strong>${esc(r.title)}</strong><span>${date(r.date)}</span></div><span class="tag">${esc(r.type||"Reminder")}</span></div>`).join(""):empty("✓","Nothing urgent","Your reminder list is clear.")}</div><div class="card"><div class="section-head"><h2>📈 Timeline</h2><a href="timeline.html" class="muted">View history</a></div><p>Your property currently has <strong>${state.timelineEvents.length}</strong> manually recorded timeline events.</p><div style="margin-top:18px">${state.activity.slice(0,5).map(a=>`<div class="record"><div class="record-icon">•</div><div class="record-meta"><strong>${esc(a.text)}</strong><span>${new Date(a.date).toLocaleString("en-GB")}</span></div></div>`).join("")||empty("📌","No activity yet","Your HomeVault activity will appear here.")}</div></div></div>`;
</script></body></html>
