<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Appliances</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/app.js"></script><script>
pageBase("appliances","Appliances","Store essential appliance information, warranties and purchase dates.");
function renderAppliances(){document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>🧊 Appliances</h2><p>Keep your appliances and warranties organised.</p></div><button class="btn btn-primary" onclick="applianceForm()">＋ Add appliance</button></div><div class="grid g3">${state.appliances.map(a=>`<div class="card"><div class="record"><div class="record-icon">${a.icon||"🧊"}</div><div class="record-meta"><strong>${esc(a.name)}</strong><span>${esc(a.manufacturer)} ${esc(a.model)}</span></div></div><div class="section"><p>Serial: ${esc(a.serial||"—")}</p><p>Warranty: ${date(a.warrantyExpiry)}</p><p>Purchased: ${date(a.purchaseDate)}</p></div><div class="actions"><button class="btn btn-ghost" onclick="applianceForm('${a.id}')">Edit</button><button class="btn btn-danger" onclick="deleteAppliance('${a.id}')">Delete</button></div></div>`).join("")||`<div class="card">${empty("🧊","No appliances","Add your fridge, washing machine, dishwasher and more.",'<button class="btn btn-primary" onclick="applianceForm()">Add appliance</button>')}</div>`}</div>`}
function applianceForm(id){const a=state.appliances.find(x=>x.id===id)||{};modal(id?"Edit appliance":"Add appliance",`<form onsubmit="saveAppliance(event,'${id||""}')"><div class="form-grid"><div class="field"><label>Appliance</label><input name="name" value="${esc(a.name||"Washing machine")}" required></div><div class="field"><label>Category</label><select name="icon"><option>🧊</option><option>❄️</option><option>🧺</option><option>🍽️</option><option>🔥</option><option>📺</option><option>📦</option></select></div><div class="field"><label>Manufacturer</label><input name="manufacturer" value="${esc(a.manufacturer||"")}"></div><div class="field"><label>Model</label><input name="model" value="${esc(a.model||"")}"></div><div class="field"><label>Serial number</label><input name="serial" value="${esc(a.serial||"")}"></div><div class="field"><label>Purchase date</label><input name="purchaseDate" type="date" value="${esc(a.purchaseDate||"")}"></div><div class="field"><label>Purchase price</label><input name="price" type="number" step=".01" value="${esc(a.price||"")}"></div><div class="field"><label>Warranty expiry</label><input name="warrantyExpiry" type="date" value="${esc(a.warrantyExpiry||"")}"></div></div><div class="actions">${id?`<button type="button" class="btn btn-danger" onclick="deleteAppliance('${id}')">Delete</button>`:""}<span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save</button></div></form>`)}
function saveAppliance(e,id){e.preventDefault();const f=formData(e.target),obj={id:id||uid(),...f,price:+f.price||0};if(id)state.appliances[state.appliances.findIndex(x=>x.id===id)]=obj;else state.appliances.unshift(obj);addActivity(id?"Updated appliance":"Added appliance");save();closeModal();renderAppliances();toast("Appliance saved")}
function deleteAppliance(id){if(!confirm("Delete this appliance?"))return;state.appliances=state.appliances.filter(x=>x.id!==id);save();renderAppliances();toast("Appliance deleted")}
renderAppliances();
</script></body></html>
