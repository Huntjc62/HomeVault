<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeVault — Vehicle</title><link rel="stylesheet" href="assets/styles.css"></head><body><script src="assets/app.js"></script><script>
pageBase("vehicle","Vehicle","Keep essential vehicle dates, history and costs together.");
function renderVehicle(){const v=state.vehicles[0];document.getElementById("content").innerHTML=`<div class="page-head"><div><h2>🚗 Vehicle</h2><p>Track MOT, insurance, tax, servicing and repairs.</p></div><button class="btn btn-primary" onclick="vehicleForm()">＋ ${v?"Edit":"Add"} vehicle</button></div>${v?`<div class="grid g2"><div class="card hero"><div class="kpi-label">VEHICLE</div><h2 style="font-size:28px;margin-top:7px">${esc(v.make)} ${esc(v.model)}</h2><p>${esc(v.registration)} · ${esc(v.mileage)} miles</p></div><div class="card"><div class="record"><div class="record-icon">🚗</div><div class="record-meta"><strong>MOT expiry</strong><span>${date(v.motExpiry)}</span></div></div><div class="record"><div class="record-icon">🛡️</div><div class="record-meta"><strong>Insurance expiry</strong><span>${date(v.insuranceExpiry)}</span></div></div><div class="record"><div class="record-icon">💷</div><div class="record-meta"><strong>Tax renewal</strong><span>${date(v.taxRenewal)}</span></div></div><div class="record"><div class="record-icon">🛠️</div><div class="record-meta"><strong>Service due</strong><span>${date(v.serviceDue)}</span></div></div></div></div><div class="section card"><div class="section-head"><h2>History</h2><button class="btn btn-ghost" onclick="vehicleHistoryForm()">＋ Add history</button></div>${(v.history||[]).length?(v.history||[]).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="record"><div class="record-icon">${x.type==="MOT"?"🚗":x.type==="Repair"?"🔧":"🛠️"}</div><div class="record-meta"><strong>${esc(x.type)}</strong><span>${date(x.date)} · ${esc(x.details||"")}</span></div><strong>${money(x.cost)}</strong></div>`).join(""):empty("🚗","No vehicle history","Add an MOT, service or repair.")}</div>`:empty("🚗","No vehicle added","Add your vehicle.",'<button class="btn btn-primary" onclick="vehicleForm()">Add vehicle</button>')}`}
function vehicleForm(){const v=state.vehicles[0]||{};modal("Vehicle",`<form onsubmit="saveVehicle(event)"><div class="form-grid"><div class="field"><label>Registration</label><input name="registration" value="${esc(v.registration||"")}" required></div><div class="field"><label>Make</label><input name="make" value="${esc(v.make||"")}"></div><div class="field"><label>Model</label><input name="model" value="${esc(v.model||"")}"></div><div class="field"><label>Year</label><input name="year" type="number" value="${esc(v.year||"")}"></div><div class="field"><label>Mileage</label><input name="mileage" type="number" value="${esc(v.mileage||"")}"></div><div class="field"><label>MOT expiry</label><input name="motExpiry" type="date" value="${esc(v.motExpiry||"")}"></div><div class="field"><label>Insurance expiry</label><input name="insuranceExpiry" type="date" value="${esc(v.insuranceExpiry||"")}"></div><div class="field"><label>Tax renewal</label><input name="taxRenewal" type="date" value="${esc(v.taxRenewal||"")}"></div><div class="field"><label>Service due</label><input name="serviceDue" type="date" value="${esc(v.serviceDue||"")}"></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save vehicle</button></div></form>`)}
function saveVehicle(e){e.preventDefault();const f=formData(e.target);state.vehicles=[{id:state.vehicles[0]?.id||uid(),...f,history:state.vehicles[0]?.history||[]}];addActivity("Updated vehicle");save();closeModal();renderVehicle();toast("Vehicle saved")}
function vehicleHistoryForm(){modal("Add vehicle history",`<form onsubmit="saveVehicleHistory(event)"><div class="form-grid"><div class="field"><label>Type</label><select name="type"><option>Service</option><option>MOT</option><option>Repair</option></select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Cost</label><input name="cost" type="number" step=".01"></div><div class="field"><label>Details</label><input name="details"></div></div><div class="actions"><span style="flex:1"></span><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Add</button></div></form>`)}
function saveVehicleHistory(e){e.preventDefault();const f=formData(e.target),v=state.vehicles[0];v.history=v.history||[];v.history.push({id:uid(),...f,cost:+f.cost||0});addActivity("Added vehicle history");save();closeModal();renderVehicle();toast("History added")}
renderVehicle();
</script></body></html>
